name: Cek Mode Pages

on:
  push:
    branches: [arena/7dc15269-project-uas]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Cek dan coba ubah build_type Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BEFORE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type + "|" + (.source.branch // "-")' 2>&1)
          PUT_OUT=$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow 2>&1)
          PUT_CODE=$?
          AFTER=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type + "|" + (.source.branch // "-")' 2>&1)
          SUMMARY="before=${BEFORE} after=${AFTER} put_exit=${PUT_CODE} put_out=$(printf '%s' "$PUT_OUT" | tr '\n' ' ' | head -c 300)"
          echo "$SUMMARY"
          echo "::warning title=PAGESMODE::$SUMMARY"
