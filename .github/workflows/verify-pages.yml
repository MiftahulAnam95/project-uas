name: Verify Pages Output
on:
  push:
    branches: [arena/a0a7b106-project-uas]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Curl site
        run: |
          curl -sS -o /tmp/p.html -w "code=%{http_code} size=%{size_download}" -L https://miftahulanam95.github.io/project-uas/ > /tmp/meta.txt 2>/tmp/err.txt || true
          SUMMARY="$(cat /tmp/meta.txt)"
          if [ -f /tmp/p.html ]; then
            SUMMARY="$SUMMARY | raw_src=$(grep -c 'src=\"/src/main.tsx\"' /tmp/p.html || true)"
            SUMMARY="$SUMMARY | root_div=$(grep -c '<div id=\"root\">' /tmp/p.html || true)"
            SUMMARY="$SUMMARY | inline_js=$(grep -c 'type=\"module\" crossorigin' /tmp/p.html || true)"
            SUMMARY="$SUMMARY | title_hits=$(grep -c 'Tugas Project UAS' /tmp/p.html || true)"
            SUMMARY="$SUMMARY | head=$(head -c 120 /tmp/p.html | tr -d '\n' | tr -cd '[:print:]')"
          else
            SUMMARY="$SUMMARY | NO_BODY $(cat /tmp/err.txt | head -c 200)"
          fi
          echo "SUMMARY=$SUMMARY"
          echo "::error title=PAGESRESULT::$SUMMARY"
