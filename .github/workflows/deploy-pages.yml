name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Izin yang dibutuhkan:
# - contents: write  -> untuk menyimpan hasil build ke index.html di root
# - pages / id-token -> untuk mempublikasikan artefak ke Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Satu deployment pada satu waktu. Jangan batalkan yang sedang berjalan,
# karena job terakhir (sync-root) melakukan push dan memicu run baru.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Lewati run yang dipicu oleh commit hasil sinkronisasi (mencegah loop).
    if: github.actor != 'github-actions[bot]'
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # GitHub Pages punya dua mode:
      #   workflow -> artefak dist/ dipublikasikan oleh actions/deploy-pages
      #   legacy   -> isi branch main dipublikasikan apa adanya
      # Mode dideteksi supaya langkah berikutnya tidak salah arah.
      - name: Deteksi mode GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo 'tidak-aktif')"
          echo "build_type=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode GitHub Pages: $MODE"
          if [ "$MODE" = "legacy" ]; then
            echo "::notice title=Pages::Mode 'Deploy from a branch' aktif. Hasil build akan disimpan ke index.html di root repositori agar situs tetap tampil."
          elif [ "$MODE" = "tidak-aktif" ]; then
            echo "::warning title=Pages::GitHub Pages belum diaktifkan di Settings -> Pages."
          fi

      - name: Tambahkan .nojekyll
        run: touch dist/.nojekyll

      # Artefak untuk mode "workflow" (actions/deploy-pages).
      - name: Upload artifact Pages
        if: steps.pages.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Artefak perantara untuk job sync-root.
      - name: Upload artifact build
        if: steps.pages.outputs.build_type == 'legacy' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist
          retention-days: 3

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Khusus mode "Deploy from a branch": GitHub menyajikan index.html di root
  # repositori. Tanpa langkah ini, yang tampil adalah template sumber
  # (dev.html) yang memanggil /src/main.tsx sehingga halaman menjadi kosong.
  sync-root:
    name: Sinkronkan hasil build ke root
    needs: [build, deploy]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build.outputs.build_type == 'legacy' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ambil hasil build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: build-output

      - name: Perbarui index.html bila berubah
        run: |
          if cmp -s build-output/index.html index.html; then
            echo "index.html di root sudah sama dengan hasil build terbaru."
            exit 0
          fi

          cp build-output/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(pages): perbarui index.html dari hasil build"
          git push
